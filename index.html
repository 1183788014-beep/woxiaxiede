let state, customChats={};
function fresh(){return {tab:'story',scene:0,time:'08:42',day:31,chapter:1,stats:{independence:52,trust:48,danger:12,family:28},people:peopleBase.map(p=>({...p})),logs:[],chat:'hyunjae',toast:''}}
function person(id){return state.people.find(p=>p.id===id)}
function clamp(n){return Math.max(0,Math.min(100,n))}
function addLog(t){if(t)state.logs.unshift({t,day:state.day,time:state.time});state.logs=state.logs.slice(0,50)}
function applyFx(fx={}){Object.entries(fx).forEach(([k,v])=>{if(k in state.stats)state.stats[k]=clamp(state.stats[k]+v);else if(person(k))person(k).v=clamp(person(k).v+v)})}
function advance(){let [h,m]=state.time.split(':').map(Number);m+=7;h=(h+Math.floor(m/60))%24;m%=60;state.time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function gotoScene(n){advance();state.scene=Math.max(0,Math.min(scenes.length-1,n));state.chapter=state.scene>=20?3:state.scene>=8?2:1;state.tab='story';render()}
function renderScene(){let sc=scenes[state.scene];return `<section class="scene"><div class="tag">${sc.place}</div><h2>${sc.title}</h2><p>${sc.text}</p>${sc.kr?`<div class="kr">${esc(sc.kr).replace(/\\n/g,'<br>')}</div><p class="zh">${esc(sc.zh).replace(/\\n/g,'<br>')}</p>`:''}</section><div class="muted" style="font-size:11px;margin-bottom:8px">你准备怎么做？</div>${sc.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('')}`}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderChat(){let p=person(state.chat),arr=[...(defaultChats[state.chat]||[]),...(customChats[state.chat]||[])];return `<div class="line" style="align-items:center;border:0"><div class="avatar" style="background:${p.color}">${p.avatar}</div><div><b>${p.name}</b><div class="muted" style="font-size:11px">${p.kr} · ${p.role}</div></div></div><div class="muted" style="font-size:11px;text-align:center;margin:10px">KakaoTalk · 最近消息</div>${arr.map(m=>`<div class="bubble">${esc(m[1])}<small>${esc(m[0])} · ${esc(m[3])}</small><div class="translation">${esc(m[2])}</div></div>`).join('')}<div class="contacts">${state.people.map(q=>`<button class="smallbtn" data-contact="${q.id}" style="${state.chat===q.id?'background:#eadbd2;font-weight:700':''}">${q.name}</button>`).join('')}</div><div class="notice">选择剧情中的聊天选项来推进对话。此处展示联系人消息；不会替主控发送任何未输入的消息。</div><button class="choice" data-goto="story"><b>返回剧情</b><span>继续当前事件</span></button>`}
function renderPeople(){return `<div class="tag">RELATIONSHIP STATUS</div><h2 style="font-size:18px;margin:7px 0 2px">人物关系</h2><p class="muted" style="font-size:12px;line-height:1.7">好感度不是忠诚度，也不能直接证明任何人的真实想法。</p>${state.people.map(p=>`<div class="line"><div class="avatar" style="background:${p.color}">${p.avatar}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:13px">${p.name}</b><span class="muted" style="font-size:11px">${p.v}/100</span></div><div class="muted" style="font-size:11px">${p.role}</div><div class="bar"><div class="fill" style="width:${p.v}%"></div></div><div style="font-size:12px;line-height:1.6;margin-top:7px;color:#655852">${p.desc}</div></div></div>`).join('')}<section class="scene" style="margin-top:15px"><div class="tag">PUBLIC STATUS</div>${[['主控独立性',state.stats.independence],['婚姻信任',state.stats.trust],['危险察觉度',state.stats.danger],['家族警觉度',state.stats.family]].map(([n,v])=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${n}</span><b>${v}/100</b></div><div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`).join('')}</section><button class="choice" data-goto="story"><b>回到剧情</b></button>`}
function renderSave(){let txt=`《富家大小姐的危险婚姻》存档\\n婚后第${state.day}天｜${state.time}｜事件：${scenes[state.scene].title}\\n属性：独立性${state.stats.independence}，婚姻信任${state.stats.trust}，危险察觉度${state.stats.danger}，家族警觉度${state.stats.family}\\n人物关系：${state.people.map(p=>p.name+' '+p.v+'/100').join('；')}\\n事件记录：\\n${state.logs.map(x=>`第${x.day}天 ${x.time} ${x.t}`).join('\\n')}\\n注意：未列出的剧情秘密仍未证实。`;return `<div class="tag">JOURNAL & SAVE</div><h2 style="font-size:18px;margin:7px 0">事件记录</h2><p class="muted" style="font-size:12px;line-height:1.7">游戏进度在当前页面运行期间保留。可复制存档文本到备忘录，方便手动保存。</p><button class="choice" id="make-save"><b>生成可复制的存档文本</b><span>整理当前进度、关系数值和事件记录</span></button><div id="save-area"></div><h3 style="font-size:13px;margin:18px 0 6px">最近发生的事件</h3>${state.logs.length?state.logs.map(x=>`<div class="log"><span class="muted">第${x.day}天 · ${x.time}</span><br>${esc(x.t)}</div>`).join(''):'<div class="notice">目前还没有事件记录。选择剧情选项后，这里会记录重要变化。</div>'}<button class="choice" data-goto="story"><b>返回剧情</b></button>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#day-label').textContent=`婚后 · 第 ${state.day} 天`;$('#chapter-tag').textContent='CH. '+String(state.chapter).padStart(2,'0');$('#clock').textContent=state.time;$('#status-text').textContent=state.toast||'你的选择将改变关系与后续事件';$('#content').innerHTML=state.tab==='story'?renderScene():state.tab==='chat'?renderChat():state.tab==='people'?renderPeople():renderSave();
document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{let c=scenes[state.scene].choices[+b.dataset.choice];applyFx(c[3]);addLog(c[5]);if(c[4])state.chat=c[4];if(c[0]==='查看人物关系'){state.tab='people';render();return}if(c[0]==='查看存档与事件记录'){state.tab='save';render();return}gotoScene(c[2])}));
document.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>{state.chat=b.dataset.contact;state.tab='chat';render()}));document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.goto;render()}));
const make=$('#make-save');if(make)make.addEventListener('click',()=>{$('#save-area').innerHTML=`<textarea id="save-text" readonly>${txtSafe()}</textarea><button class="choice" id="select-save"><b>选中存档文本</b><span>然后选择复制，保存到备忘录</span></button>`;$('#select-save').addEventListener('click',()=>{$('#save-text').focus();$('#save-text').select();state.toast='已选中存档文本，请复制到备忘录保存。';$('#status-text').textContent=state.toast})});
}
function txtSafe(){return `《富家大小姐的危险婚姻》存档\n婚后第${state.day}天｜${state.time}｜事件：${scenes[state.scene].title}\n属性：独立性${state.stats.independence}，婚姻信任${state.stats.trust}，危险察觉度${state.stats.danger}，家族警觉度${state.stats.family}\n人物关系：${state.people.map(p=>p.name+' '+p.v+'/100').join('；')}\n事件记录：\n${state.logs.map(x=>`第${x.day}天 ${x.time} ${x.t}`).join('\n')}\n注意：未列出的剧情秘密仍未证实。`}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}));
$('#restart').addEventListener('click',()=>{if(confirm('确定重新开始？本次进度与事件记录将被清空。')){state=fresh();customChats={};render()}});
state=fresh();render();
})();
